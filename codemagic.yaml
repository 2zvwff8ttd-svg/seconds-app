# Codemagic CI for ?Seconds (Capacitor 8 + Next.js)
#
# Phase 1 (current): unsigned compile check — verify iOS native code builds.
# Phase 2 (after Apple Developer approval): enable the commented workflow below
# for code signing, App Store Connect upload, and .ipa generation.

workflows:
  ios-unsigned-compile-check:
    name: iOS unsigned compile check
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Capacitor 8 + Next.js 16 — Node 22 LTS
      node: 22
      # Capacitor 8 requires a recent Xcode (iOS 15+ deployment target)
      xcode: latest
      # Capacitor 8 uses Swift Package Manager — CocoaPods / pod install is NOT required.
      vars:
        XCODE_SCHEME: App
        # Capacitor 8 (SPM) generates App.xcodeproj, not App.xcworkspace.
        # If you later add CocoaPods, switch to -workspace ios/App/App.xcworkspace.
        XCODE_PROJECT: ios/App/App.xcodeproj
        # Placeholders so `npm run build` can compile without real Supabase credentials.
        # Replace with Codemagic encrypted env vars when you want production-like builds.
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-compile-check

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build Next.js
        script: npm run build

      - name: Sync Capacitor iOS (web assets + SPM plugins)
        script: npx cap sync ios

      - name: Build iOS without code signing (compile check only)
        script: |
          set -eo pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild_logs/build.log

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - k.kai0702@icloud.com
        notify:
          success: true
          failure: true

