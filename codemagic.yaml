# Codemagic CI for ?Seconds (Capacitor 8 + Next.js)
#
# ios-unsigned-compile-check — auto on master push (compile-only, no signing)
# ios-release            — manual Start build only (signed .ipa → TestFlight)

workflows:
  ios-unsigned-compile-check:
    name: iOS unsigned compile check
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_SCHEME: App
        XCODE_PROJECT: ios/App/App.xcodeproj
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-compile-check

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build Next.js
        script: npm run build

      - name: Sync Capacitor iOS (web assets + SPM plugins)
        script: npx cap sync ios

      - name: Build iOS without code signing (compile check only)
        script: |
          set -eo pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild build \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/xcodebuild_logs/build.log

    artifacts:
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app

    publishing:
      email:
        recipients:
          - k.kai0702@icloud.com
        notify:
          success: true
          failure: true

  # Manual only — Codemagic UI → Start new build → ios-release
  # (no triggering block = not started by git push)
  ios-release:
    name: iOS release (signed .ipa → TestFlight)
    max_build_duration: 90
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: seconds_api_key

    environment:
      groups:
        - appstore_credentials
      node: 22
      xcode: latest
      vars:
        BUNDLE_ID: com.seconds.kai
        XCODE_SCHEME: App
        XCODE_PROJECT: ios/App/App.xcodeproj
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-ci-compile-check
        # CERTIFICATE_PRIVATE_KEY は groups: appstore_credentials に登録（encrypted）

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build Next.js
        script: npm run build

      - name: Sync Capacitor iOS (web assets + SPM plugins)
        script: npx cap sync ios

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch signing files (create certificate & profile if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      - name: Build signed .ipa (device / App Store distribution)
        script: |
          set -eo pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            2>&1 | tee /tmp/xcodebuild_logs/build-ipa.log

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - k.kai0702@icloud.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # beta_groups は指定しない:
        # - 内部テスター（App Store Connect チームメンバー）は TestFlight → 内部テスト から自動で利用可能
        # - 外部テスターへ配るときは App Store Connect でグループを作り、
        #   下記 beta_groups に正確なグループ名を追加するか、ASC 上で手動配布する
        # beta_groups:
        #   - Friends
