# https://supabase.com/docs/guides/cli/config
project_id = "ynnabzfgkrrqrtrdckyk"

[api]
enabled = true

[db]
major_version = 15

# Edge Function: daily-morning（毎朝 7:00 JST の日次ジョブ）
# Cron は config.toml では定義できません。次のいずれかで設定:
#   - Dashboard → Edge Functions → daily-morning → Schedules → 0 22 * * * (UTC)
#   - SQL Editor → supabase/sql/schedule-daily-morning-cron.sql
[functions.daily-morning]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[functions.enforce-auth-ban]
verify_jwt = true
